<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 안전점검 보고서 검색</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1b2430;--sub:#5b6675;--line:#d9dee6;--brand:#12396b;--hl:#ffe27a;--ok:#1f7a4d;--warn:#a8650b;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--panel:#18202a;--ink:#e8ecf1;--sub:#9aa6b5;--line:#2a3542;--brand:#8db4ea;--hl:#6b5a12;--ok:#5fcf97;--warn:#f0b35a;--bad:#ff8c84}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.65}
main{max-width:920px;margin:0 auto;padding:40px 20px 80px}
h1{font-size:1.75rem;margin:0 0 6px;letter-spacing:-.02em}
.lead{color:var(--sub);margin:0 0 28px}
h2{font-size:1.15rem;margin:44px 0 6px}
.search{display:flex;gap:12px;align-items:center;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:2}
input[type=search]{flex:1;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
input[type=search]:focus,button:focus-visible,iframe:focus-visible{outline:3px solid var(--brand);outline-offset:1px}
#count{white-space:nowrap;font-weight:700;color:var(--brand)}
.cards{display:grid;gap:12px;margin-top:8px}
.card{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--brand);border-radius:6px;padding:16px 18px}
.card h3{margin:0 0 6px;font-size:1.05rem}
.card .no{color:var(--brand);margin-right:8px}
.card p{margin:0 0 8px;white-space:pre-line}
.card .full{display:none}
.card.open .full{display:block}
.card.open .sum{display:none}
button.toggle{font:inherit;font-size:.9rem;background:none;border:1px solid var(--line);border-radius:4px;padding:4px 10px;color:var(--brand);cursor:pointer}
mark{background:var(--hl);color:inherit;padding:0 1px}
.empty{padding:28px;text-align:center;color:var(--sub);border:1px dashed var(--line);border-radius:6px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:.92rem}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:color-mix(in srgb,var(--brand) 10%,var(--panel))}
.ok{color:var(--ok);font-weight:700}.warn{color:var(--warn);font-weight:700}.bad{color:var(--bad);font-weight:700}
iframe{width:100%;height:420px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.note{color:var(--sub);font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>2026 행정안전부 안전점검 결과 보고서</h1>
<p class="lead">장별 카드를 키워드로 검색하고, 보고서 5개 사실의 정합성 매트릭스를 함께 확인합니다. (가상 보고서)</p>

<div class="search" role="search">
  <input id="q" type="search" placeholder="제목이나 본문에서 검색 (예: 점검, 예산, 권혁수)" aria-label="키워드 검색" autocomplete="off">
  <span id="count" aria-live="polite"></span>
</div>
<div id="cards" class="cards"></div>

<h2>보고서 5사실 정합성 매트릭스</h2>
<p class="note">총 점검 건수, 지적사항 건수, 시정 완료율, 예산 집행률, 총괄책임자를 장별로 대조했습니다.</p>
<div id="sheet"></div>

</main>
<script>
/* Google Sheets 임베드 주소: 시트에서 [파일 > 공유 > 웹에 게시 > 임베드]로 얻은 iframe의 src 값을 붙여넣으세요. */
const SHEET_EMBED_URL = "";

const FALLBACK = [{"장": "1", "제목": "개요", "본문": "본 보고서는 행정안전부 안전정책총괄과가 2026년 상반기 실시한 종합 안전점검 결과를 정리한 자료다.\n\n총 점검 건수는 **450건**이며, 지적사항 **120건** 중 시정 완료율은 **85%**이다. 예산 집행률은 **92%**, 총괄책임자는 **권혁수** 안전정책총괄과장이다."}, {"장": "2", "제목": "분야별 결과", "본문": "분야별 점검은 시설안전·교통안전·재난안전·산업안전 4개 분야로 진행됐다. 분야별 총합은 **450건**과 일치한다.\n\n지적사항 **115건** 중 80% 이상이 1분기 내 시정되었으며, 누적 시정 완료율은 **85%**으로 집계됐다. "}, {"장": "3", "제목": "예산 운용", "본문": "상반기 예산 집행률 **90%**은 전년 동기 대비 5%p 상승한 수치다. \n\n총괄 운영은 **권혁수** 과장이 직접 주재했고, 분기별 점검회의 5회를 개최했다."}, {"장": "4", "제목": "향후 계획", "본문": "하반기에는 추가 점검 **440건**을 목표로 추진한다. \n\n상반기 시정 완료율 **82%** 수준에 머문 일부 지자체는 추가 컨설팅 대상으로 지정한다. "}, {"장": "5", "제목": "결론", "본문": "행정안전부 안전정책총괄과는 2026년 상반기 동안 **450건**의 안전점검을 차질 없이 완료했다. 총괄 책임은 **권혁주** 과장이 맡았으며, 향후에도 분기별 점검 체계를 강화한다. "}];
const MATRIX = [
 ["사실","1장","2장","3장","4장","5장","판정"],
 ["총 점검 건수","450건","450건","-","440건(하반기 목표)","450건","ok|일치"],
 ["지적사항 건수","120건","115건","-","-","-","bad|불일치"],
 ["시정 완료율","85%","85%","-","82%(일부 지자체)","-","warn|확인 필요"],
 ["예산 집행률","92%","-","90%","-","-","bad|불일치"],
 ["총괄책임자","권혁수","-","권혁수","-","권혁주","bad|불일치"]
];

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

function hl(text, kw){
  const safe = esc(text);
  if(!kw) return safe;
  return safe.replace(new RegExp(reEsc(esc(kw)), "gi"), m => "<mark>" + m + "</mark>");
}
function rich(text, kw){
  return text.split(/\*\*(.+?)\*\*/).map((seg,i) => i%2 ? "<strong>" + hl(seg,kw) + "</strong>" : hl(seg,kw)).join("");
}
function summary(body){
  const plain = body.replace(/\*\*/g,"").split(/\n+/)[0].trim();
  return plain.length > 70 ? plain.slice(0,70) + "…" : plain;
}

let chapters = [];
function render(){
  const kw = $("q").value.trim();
  const low = kw.toLowerCase();
  const hits = chapters.filter(c => !low || (c["제목"] + " " + c["본문"]).toLowerCase().includes(low));
  $("count").textContent = "결과 " + hits.length + "건";
  $("cards").innerHTML = hits.length ? hits.map(c => `
    <article class="card ${kw ? "open" : ""}">
      <h3><span class="no">${esc(c["장"])}장</span>${hl(c["제목"],kw)}</h3>
      <p class="sum">${hl(summary(c["본문"]),kw)}</p>
      <p class="full">${rich(c["본문"].trim(),kw)}</p>
      <button class="toggle" type="button" aria-expanded="${kw ? "true" : "false"}">${kw ? "접기" : "전체 보기"}</button>
    </article>`).join("") : '<div class="empty">검색 결과가 없습니다. 다른 키워드로 다시 검색해 보세요.</div>';
}
$("cards").addEventListener("click", e => {
  const b = e.target.closest("button.toggle"); if(!b) return;
  const card = b.closest(".card"); const open = card.classList.toggle("open");
  b.textContent = open ? "접기" : "전체 보기"; b.setAttribute("aria-expanded", open);
});
$("q").addEventListener("input", render);

function renderSheet(){
  const box = $("sheet");
  if(SHEET_EMBED_URL){
    box.innerHTML = '<iframe title="정합성 매트릭스 (Google Sheets)" loading="lazy"></iframe>';
    box.firstChild.src = SHEET_EMBED_URL;
    return;
  }
  const [head,...rows] = MATRIX;
  box.innerHTML = '<div class="tablewrap"><table><thead><tr>' + head.map(h=>"<th>"+h+"</th>").join("") + "</tr></thead><tbody>" +
    rows.map(r => "<tr>" + r.map((v,i) => { if(i===6){const [k,t]=v.split("|"); return '<td class="'+k+'">'+t+"</td>";} return "<td>"+esc(v)+"</td>"; }).join("") + "</tr>").join("") +
    '</tbody></table></div><p class="note">Google Sheets 임베드 주소(SHEET_EMBED_URL)가 아직 비어 있어 같은 내용의 표를 대신 보여줍니다.</p>';
}

(async function init(){
  try{
    const r = await fetch(encodeURI("장데이터.json"));
    if(!r.ok) throw new Error(r.status);
    chapters = await r.json();
  }catch(e){ chapters = FALLBACK; }
  render(); renderSheet();
})();
</script>
</body>
</html>
